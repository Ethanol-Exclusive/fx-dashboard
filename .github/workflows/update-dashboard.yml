name: Update Trading Dashboard

on:
  schedule:
    # Runs at 11:00 UTC daily (~7:00 AM New York during EDT, 6:00 AM during EST)
    # Edit the cron time below if you want it at a different hour.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz

      - name: Generate dashboard
        run: python daily_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
