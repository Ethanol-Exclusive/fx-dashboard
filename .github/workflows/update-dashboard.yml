name: Update Trading Dashboard

on:
  schedule:
    # Runs every 30 minutes, 24/7. Set conservatively to stay within
    # Twelve Data's free-tier rate limits (10 symbols x 3 calls = 30
    # API calls per run) - tighten to */15 later if your plan supports it.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy pytz requests

      - name: Generate dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python daily_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html last_signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
