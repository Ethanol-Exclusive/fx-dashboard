name: Update Trading Dashboard

on:
  schedule:
    # Runs every 15 minutes, Monday-Friday, during roughly 7AM-6PM New York time
    # (covers London/NY session overlap through NY close). Times below are in UTC.
    # NY is UTC-4 (EDT, summer) or UTC-5 (EST, winter) - this covers both safely.
    - cron: "*/15 11-23 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz requests

      - name: Generate dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html last_signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
