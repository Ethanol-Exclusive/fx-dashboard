name: Update Trading Dashboard

on:
  schedule:
    # Runs every 5 minutes, Monday-Friday only (no weekend trading, per
    # instruction - most forex/indices are closed anyway, and this also
    # stops any weekend BTCUSD signals since weekends aren't traded).
    # Tightened from 15 to 5 minutes for faster signal delivery after a
    # genuine MSS/BOS confirmation.
    - cron: "*/5 * * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy pytz requests

      - name: Generate dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python daily_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html last_signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
